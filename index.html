<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonepile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen portrait game. Stats row, the well (canvas), skull bar. Black line drawings on white. */
:root { --bg: #ffffff; --fg: #000000; --muted: #777777; --line: #000000; color-scheme: light; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; box-sizing: border-box; gap: 8px; }
#stats { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
#stats b { font-size: 18px; display: inline-block; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
#msg { min-height: 18px; font-size: 13px; text-align: center; }
#wrap { flex: 1; min-height: 0; position: relative; }
canvas { display: block; width: 100%; height: 100%; }
#bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
button { font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
button:focus-visible { outline: 3px dashed var(--fg); outline-offset: 2px; }
#skull { width: 84px; height: 84px; border: none; border-radius: 50%; padding: 0; display: grid; place-items: center; background: transparent; }
#skull svg { animation: breathe 4.5s ease-in-out infinite; transform-origin: 50% 60%; }
@keyframes breathe { 50% { transform: scale(1.06); } }
#skull .jaw { transition: transform .16s ease-out; }
#skull.open .jaw { transform: translateY(6px); }
#skull .pupil { opacity: 0; transition: opacity .2s; }
#skull.fed .pupil { opacity: 1; }
#skull.fed svg { animation: gulp .45s ease-out; }
@keyframes gulp { 30% { transform: scale(1.18); } 60% { transform: scale(0.96); } }
#skull.refuse svg { animation: refuse .55s ease-in-out; }
#skull.laugh svg { animation: cackle 1.4s ease-in-out; }
#skull.laugh .jaw { animation: chatter .14s ease-in-out 9 alternate; }
#skull.laugh .pupil { opacity: 1; }
@keyframes cackle { 15% { transform: rotate(-10deg) translateY(-3px); } 35% { transform: rotate(8deg); } 55% { transform: rotate(-8deg) translateY(-2px); } 75% { transform: rotate(6deg); } }
@keyframes chatter { to { transform: translateY(6px); } }
@keyframes refuse { 20% { transform: rotate(-9deg); } 50% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) { #skull svg { animation: none !important; } }
#help { font-size: 12px; color: var(--muted); max-width: 12em; }
#over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bg); border: 2px solid var(--line); text-align: center; padding: 16px; }
#over h2, #shop h2 { margin: 0; font-size: 22px; }
#next { min-height: 16px; font-size: 12px; text-align: center; color: var(--muted); letter-spacing: 0.04em; }
#shop { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 10px; background: var(--bg); border: 2px solid var(--line); padding: 16px; text-align: center; z-index: 2; }
#shop p { margin: 0; font-size: 13px; }
#relicList { display: flex; flex-direction: column; gap: 8px; }
.relic { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.relic b { font-size: 15px; }
.relic span { font-size: 12px; grid-column: 1; }
.relic i { font-style: normal; grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; }
.relic:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div id="app">
  <div id="stats">
    <span>GOLD <b id="gold">0</b></span>
    <span>ROUND <b id="round">1</b></span>
    <span>QUOTA <b id="quota">0/40</b></span>
    <span>BEST <b id="best">-</b></span>
  </div>
  <div id="msg">Feed the skull words. Spin discs once they land.</div>
  <div id="next"></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="over" hidden>
      <h2>The skull claims the column</h2>
      <div id="overText"></div>
      <button id="again" type="button">Play again</button>
    </div>
    <div id="shop" hidden>
      <h2 id="shopTitle">Round cleared</h2>
      <p id="shopText">The skull is fed. Choose a relic, or take nothing.</p>
      <div id="relicList"></div>
      <button id="skip" type="button">Take nothing</button>
    </div>
  </div>
  <div id="bar">
    <button id="restart" type="button">Restart</button>
    <button id="skull" type="button" aria-label="Offer words to the skull">
      <svg width="76" height="76" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M32 3C17 3 8 13 8 26c0 7 3 12 8 15v7h32v-7c5-3 8-8 8-15C56 13 47 3 32 3z" fill="#fff"/>
        <path d="M33 3l-3 7 4 4-3 6M46 9l-4 5"/>
        <path d="M14 25c3-6 12-6 14 0 1 5-4 9-8 9s-7-4-6-9z" fill="currentColor"/>
        <path d="M50 25c-3-6-12-6-14 0-1 5 4 9 8 9s7-4 6-9z" fill="currentColor"/>
        <circle class="pupil" cx="21" cy="28" r="1.8" fill="#fff" stroke="none"/>
        <circle class="pupil" cx="43" cy="28" r="1.8" fill="#fff" stroke="none"/>
        <path d="M32 34l-3 7h6z" fill="currentColor"/>
        <path d="M18 48h28M23 44v4M28 44v4M32 44v4M36 44v4M41 44v4"/>
        <g class="jaw"><path d="M18 50h28v5c0 4-6 7-14 7s-14-3-14-7z" fill="#fff"/><path d="M23 50v4M28 50v5M32 50v5M36 50v5M41 50v4"/></g>
      </svg>
    </button>
    <div id="help">Swipe a landed disc to spin it<br>Tap it: turn one step</div>
  </div>
</div>
<canvas id="fx"></canvas>

const FACES = 6;
const ROWS = 13;
const BAG = (() => {

const VOWELS = "AEIOU";

function isWord(w) {
  w = w.toLowerCase();
  if (w.length < 3) return false;
  if (WORDS.has(w)) return true;
  const has = s => s.length >= 3 && WORDS.has(s);
  const dbl = s => s.length >= 4 && s[s.length-1] === s[s.length-2] && has(s.slice(0, -1));
  if (w.endsWith("ies") && has(w.slice(0, -3) + "y")) return true;
  if (w.endsWith("es") && /(s|x|z|ch|sh)$/.test(w.slice(0, -2)) && has(w.slice(0, -2))) return true;
  if (w.endsWith("s") && !w.endsWith("ss") && has(w.slice(0, -1))) return true;
  for (const suf of ["ed", "er"]) {
    if (w.endsWith(suf)) {
      const s = w.slice(0, -2);
      if (has(s) || has(s + "e") || dbl(s)) return true;
      if (s.endsWith("i") && has(s.slice(0, -1) + "y")) return true;
    }
  }
  if (w.endsWith("ing")) { const s = w.slice(0, -3); if (has(s) || has(s + "e") || dbl(s)) return true; }
  if (w.endsWith("ly") && has(w.slice(0, -2))) return true;
  return false;
}

// Locked discs: rare, one letter, can't be spun. Words that use one pay LOCKED_MULT x gold.
const LOCKED_CHANCE = 1 / 40;

const LOCKED_LETTERS = ["J", "K", "QU", "V", "X", "Z", "W", "Y", "H", "B"];
const LOCKED_MULT = 3;
const SMASH_COST = 15;

// Cursed discs: an ordinary disc with a countdown. Use it in a word within CURSE_DROPS landings,
// or it darkens the discs touching it (dark discs read as nothing until smashed).
const CURSE_CHANCE = 1 / 25;
const CURSE_DROPS = 4;

// Rounds: earn the quota before the column fills. Quota climbs each round.
function quotaFor(round) { return 30 * round + 10 * round * round; } // 40, 100, 180, 280, 400...

// Relics: bought between rounds. price = base + RELIC_PRICE_STEP x (round - 1)
const RELIC_PRICE_STEP = 10;
const RELICS = [

  { id: "maw", name: "Hungry Maw", desc: "5+ letter words also crumble the disc below", base: 30 },
  { id: "long", name: "Long Tongue", desc: "6+ letter words pay double", base: 35 },
  { id: "slow", name: "Slow Sand", desc: "Discs fall 25% slower", base: 30 },
  { id: "pact", name: "Blood Pact", desc: "Chains climb +1x per link instead of +0.5x", base: 30 },
  { id: "mercy", name: "Mercy", desc: "Smashing costs half", base: 20 },
  { id: "lens", name: "Grave Lens", desc: "See three discs ahead instead of two", base: 15 },
  { id: "ward", name: "Ward", desc: "Curses take 3 more drops to spread", base: 20 },
];

// Chains: words that form on their own after a clear pay 1 + CHAIN_STEP x link.
const CHAIN_STEP = 0.5;

function makeDisc(rand = Math.random, allowLocked = true) {
  if (allowLocked && rand() < LOCKED_CHANCE) return { faces: [LOCKED_LETTERS[Math.floor(rand() * LOCKED_LETTERS.length)]], rot: 0, target: 0, locked: true };
  const faces = [];
  if (rand() < 0.18) faces.push(DIGRAPHS[Math.floor(rand() * DIGRAPHS.length)]);
  let guard = 0;
  while (faces.length < FACES && guard++ < 200) {
    const l = BAG[Math.floor(rand() * BAG.length)];
    if (!faces.includes(l)) faces.push(l);
  }
  // make sure each disc has at least two vowels
  let v = faces.filter(f => VOWELS.includes(f)).length;
  for (let i = faces.length - 1; v < 2 && i >= 0; i--) {
    if (!VOWELS.includes(faces[i]) && faces[i].length === 1) {
      const pool = VOWELS.split("").filter(x => !faces.includes(x));
      faces[i] = pool[Math.floor(rand() * pool.length)];
      v++;
    }
  }
  // shuffle
  for (let i = faces.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [faces[i], faces[j]] = [faces[j], faces[i]]; }
  return { faces, rot: 0, target: 0 };
}

function front(d) { if (d.dark) return "#"; const n = d.faces.length; return d.faces[((Math.round(d.target) % n) + n) % n]; }

// stack[0] is the bottom disc. The word reads top to bottom.
// Returns the longest valid word in any run of touching discs not in `used`, or null.
function bestRun(stack, used = new Set()) {
  let best = null;
  for (let hi = stack.length - 1; hi >= 0; hi--) {
    let w = "";
    for (let lo = hi; lo >= 0 && !used.has(lo); lo--) {
      w += front(stack[lo]);
      if (w.length >= 3 && (!best || w.length > best.word.length) && isWord(w)) best = { hi, lo, word: w };
    }
  }
  return best;
}

// Every word in the stack: take the longest, then the longest in what's left, and so on.
function findWords(stack) {
  const used = new Set(), found = [];
  for (let r; (r = bestRun(stack, used)); ) {
    found.push(r);
    for (let i = r.lo; i <= r.hi; i++) used.add(i);
  }
  return found.sort((a, b) => b.hi - a.hi);
}

const GOLD = [0, 0, 0, 5, 12, 30, 70, 160, 350, 750, 1500, 3000];
function goldFor(len) { return GOLD[Math.min(len, GOLD.length - 1)]; }
// mods: { vowels: bool, long: bool, chain: multiplier }

  let locked = false;
  for (let i = r.lo; i <= r.hi; i++) if (stack[i].locked) locked = true;
  let g = goldFor(r.word.length) * (locked ? LOCKED_MULT : 1);
  if (mods.long && r.word.length >= 6) g *= 2;
  if (mods.vowels) g += 2 * (r.word.match(/[AEIOU]/g) || []).length;

    $("best").textContent = st.best || "-";
    const lookahead = has("lens") ? 3 : 2;
    $("next").textContent = "NEXT  " + st.queue.slice(0, lookahead).map(d => d.locked ? `[${d.faces[0]}]` : d.cursed ? `${d.faces.join("")}!` : d.faces.join("")).join("   ");

  }
  function say(t) { $("msg").textContent = t; }

  function resize() {

    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cellH = Math.floor((H - 8) / ROWS);
    wellW = Math.min(W - 4, cellH * 6.5);

    wellTop = H - 4 - cellH * ROWS;
  }
  // slot 0 is the bottom row

  // Upcoming discs. Locked and cursed discs are capped across the column, the falling disc and the queue.
  function nextDisc() {
    const all = [...st.stack, ...st.queue, ...(st.falling ? [st.falling] : [])];
    const d = makeDisc(Math.random, all.filter(x => x.locked).length < LOCKED_MAX);
    if (!d.locked && !all.some(x => x.cursed) && Math.random() < CURSE_CHANCE) { d.cursed = true; d.curse = CURSE_DROPS + (has("ward") ? 3 : 0); }
    return d;

  function spawn(now) {
    if (st.stack.length >= ROWS) return gameOver();
    const d = st.queue.shift(); refillQueue();
    d.y = ROWS; st.falling = d; st.spawnedRound++;
    if (d.locked) laugh("The skull laughs. A locked disc is coming.");
    else if (d.cursed) laugh(`The skull laughs. A cursed disc: use it within ${d.curse} drops.`);
    hud();
  }

  function gameOver() {

  }

  // A cursed disc's time ran out: the discs touching it go dark.
  function curse(d) {
    const i = st.stack.indexOf(d);
    for (const j of [i - 1, i + 1]) { const n = st.stack[j]; if (n && !n.locked) n.dark = true; }
    d.cursed = false;
    flash = performance.now();
    skullBtn.classList.remove("refuse"); void skullBtn.offsetWidth; skullClass("refuse", 600);
    say(`The curse spreads. Dark discs read as nothing. Tap one twice to smash it (${smashCost()} gold).`);
  }

  // ---------- between rounds: the relic shop ----------
  function openShop() {
    st.shopOpen = true;
    const pool = RELICS.filter(r => !has(r.id)).sort(() => Math.random() - 0.5).slice(0, 3);
    $("shopTitle").textContent = `Round ${st.round} cleared`;
    $("shopText").textContent = pool.length ? `The skull is fed. You have ${st.gold} gold. Choose a relic, or take nothing.` : "The skull is fed. You own every relic.";
    const list = $("relicList"); list.innerHTML = "";
    for (const r of pool) {
      const price = r.base + RELIC_PRICE_STEP * (st.round - 1);
      const b = document.createElement("button");
      b.type = "button"; b.className = "relic"; b.id = "relic-" + r.id; b.disabled = st.gold < price;
      b.innerHTML = `<b>${r.name}</b><i>${price} gold</i><span>${r.desc}</span>`;
      b.addEventListener("click", () => {
        if (st.gold < price) return;
        st.gold -= price; st.shown = st.gold; st.relics.add(r.id);
        startRound(st.round + 1);

      list.appendChild(b);
    }
    $("shop").hidden = false;
  }

  // ---------- the offering: letters drift into the skull's mouth, it swallows, then pays ----------
  const HILITE_MS = 850;
  const skullBtn = $("skull");
  function skullClass(c, ms) { skullBtn.classList.add(c); if (ms) setTimeout(() => skullBtn.classList.remove(c), ms); }
  function submit() {
    if (st.over || st.pending || st.shopOpen || st.checkChain) return;
    const found = findWords(st.stack);
    if (!found.length) {
      say("The skull is not satisfied.");
      flash = performance.now();
      skullBtn.classList.remove("refuse"); void skullBtn.offsetWidth; skullClass("refuse", 600);

    }
    st.chain = 0;
    offer(found, 1);
  }
  function offer(found, mult) {
    const discs = new Set();
    const parts = [];
    let total = 0;
    const now = performance.now();
    const mods = { vowels: has("vowels"), long: has("long"), chain: mult };
    found.forEach((r, k) => {
      const g = runGold(st.stack, r, mods);
      st.gold += g; total += g;
      if (!st.best || r.word.length > st.best.length) st.best = r.word;
      const locked = st.stack.slice(r.lo, r.hi + 1).some(d => d.locked);
      parts.push(r.word + (locked ? ` (x${LOCKED_MULT})` : ""));
      for (let i = r.lo; i <= r.hi; i++) discs.add(st.stack[i]);
      if (has("maw") && r.word.length >= 5 && r.lo > 0) discs.add(st.stack[r.lo - 1]);
      addCoins(g, k, now + HILITE_MS + 250 + k * 250);

    const pre = mult > 1 ? `Chain x${mult}! ` : "";
    const met = !st.roundDone && st.roundGold >= quotaFor(st.round);
    if (met) st.roundDone = true;
    // each offered letter lifts off its disc and drifts into the mouth, top of the column first
    const cr = cv.getBoundingClientRect();
    const order = [...discs].sort((a, b) => b.y - a.y);
    const gap = Math.min(45, 320 / order.length);
    order.forEach((d, i) => offerings.push({ ch: front(d), x: cr.left + wellX + wellW / 2, y: cr.top + rowY(d.y) + cellH / 2, t0: now + i * gap, dur: HILITE_MS - 330 }));
    say(`${pre}The skull accepts ${parts.join(", ")}.`);
    skullClass("open");
    setTimeout(() => {
      skullBtn.classList.remove("open");
      skullClass("fed", 900);
      veil = performance.now();
      say(`${pre}The skull accepts ${parts.join(", ")}.  +${total} gold${met ? ". Quota met." : ""}`);
    }, HILITE_MS);
    st.pending = { discs, t: now };
    hud();
  }
  function crumblePending(now) {

    st.stack = st.stack.filter(d => !p.discs.has(d));
    st.checkChain = true; // discs above will fall; check for words that form on their own
    hud();
  }
  let flash = 0;

  function update(dt, now) {
    if (st.over || st.shopOpen) return;

    // chain: once the column has settled after a clear, any word that formed pays a growing multiplier
    if (st.checkChain && !st.pending && st.stack.every((d, i) => d.y === i)) {
      st.checkChain = false;
      const found = findWords(st.stack);
      if (found.length) { st.chain++; offer(found, 1 + st.chain * (has("pact") ? 1 : CHAIN_STEP)); }
      else st.chain = 0;

    if (st.roundDone && !st.falling && !st.pending && !st.checkChain && !coins.length && now - st.lastOffer > 1500) { openShop(); return; }

      const f = st.falling;
      f.rot += (f.target - f.rot) * Math.min(1, dt * 18);

      if (st.stack.length >= ROWS && now < st.spawnAt + 1500) {/* last chance window */}
      else spawn(now);

      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = ink;
      if (d.locked) {
        ctx.font = `bold ${h * (d.faces[0].length > 1 ? 0.56 : 0.7)}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.fillText(d.faces[0], cx, top + ry + 1);
      }
      if (armed) { ctx.font = `${Math.max(10, h * 0.3)}px ui-monospace, Menlo, Consolas, monospace`; ctx.textAlign = "left"; ctx.fillText(`smash? -${smashCost()}`, x0 + ex + 4, top + ry + 1); }
      ctx.restore();
      return;
    }
    if (d.cursed) {
      // hatching at both ends, and the drops left, just outside the column
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.moveTo(x0 + ex + 6 + k * 6, top + 3); ctx.lineTo(x0 + ex + k * 6, top + h - 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x1 - ex - 6 - k * 6, top + 3); ctx.lineTo(x1 - ex - k * 6, top + h - 3); ctx.stroke();
      }
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
      ctx.font = `bold ${Math.max(11, h * 0.45)}px ui-monospace, Menlo, Consolas, monospace`;
      ctx.fillText(String(d.curse), wellX + wellW + 12, top + ry + 1);
    }
    if (broken) { // crack lines
      ctx.beginPath(); ctx.moveTo(cx - R * 0.3, top); ctx.lineTo(cx - R * 0.1, top + h * 0.5); ctx.lineTo(cx - R * 0.25, top + h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + R * 0.35, top); ctx.lineTo(cx + R * 0.15, top + h * 0.6); ctx.lineTo(cx + R * 0.3, top + h); ctx.stroke();
    }
    // letters around the rim
    const n = d.faces.length, step = Math.PI * 2 / n;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let k = Math.floor(d.rot) - 3; k <= Math.ceil(d.rot) + 3; k++) {
      const a = (k - d.rot) * step;
      const c = Math.cos(a);
      if (c <= 0.05) continue;
      const lx = cx + Math.sin(a) * (R - ex) * 0.92;
      const face = d.faces[((k % n) + n) % n];
      const size = h * (face.length > 2 ? 0.48 : face.length > 1 ? 0.56 : 0.7);
      ctx.save();
      ctx.translate(lx, top + ry + 1);
      ctx.scale(Math.max(0.15, c), 1);
      ctx.globalAlpha = alpha * (0.25 + 0.75 * c * c);
      ctx.font = `${c > 0.9 ? "bold " : ""}${size}px ui-monospace, Menlo, Consolas, monospace`;
      ctx.fillStyle = ink;
      ctx.fillText(face, 0, 0);
      ctx.restore();
      // divider between faces
      const ad = a + step / 2, cd = Math.cos(ad);
      if (cd > 0.05) {
        const dx = cx + Math.sin(ad) * (R - ex) * 0.92;
        ctx.globalAlpha = alpha * 0.35;
        ctx.beginPath(); ctx.moveTo(dx, top + 3); ctx.lineTo(dx, top + h - 3); ctx.stroke();
        ctx.globalAlpha = alpha;
      }
    }
    ctx.restore();
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    // the well
    ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wellX, wellTop); ctx.lineTo(wellX, wellTop + ROWS * cellH); ctx.lineTo(wellX + wellW, wellTop + ROWS * cellH); ctx.lineTo(wellX + wellW, wellTop);
    ctx.stroke();
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(wellX, wellTop); ctx.lineTo(wellX + wellW, wellTop); ctx.stroke();
    ctx.setLineDash([]);
    // reading arrow on the left: top to bottom
    if (wellX > 18) {
      const ax = wellX - 10;
      ctx.beginPath(); ctx.moveTo(ax, wellTop + 10); ctx.lineTo(ax, wellTop + ROWS * cellH - 10);
      ctx.lineTo(ax - 5, wellTop + ROWS * cellH - 18); ctx.moveTo(ax, wellTop + ROWS * cellH - 10); ctx.lineTo(ax + 5, wellTop + ROWS * cellH - 18);
      ctx.stroke();
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(0, wellTop - 2, W, H); ctx.clip();
    for (const d of st.stack) drawDisc(d, rowY(d.y), 1, 0, !!(st.pending && st.pending.discs.has(d)));
    if (st.falling) drawDisc(st.falling, rowY(st.falling.y));
    ctx.restore();
    for (const c of st.crumble) { const p = (now - c.t) / 500; drawDisc(c.d, rowY(c.y), 1 - p, p); }
    if (now - flash < 250) { ctx.strokeStyle = "#000"; ctx.lineWidth = 6; ctx.strokeRect(wellX, wellTop, wellW, ROWS * cellH); }
  }

  // ---------- input: swipe a disc sideways to turn it ----------
  // Only landed discs can be turned: swipe or tap the disc itself. The falling disc can't be touched.
  let drag = null;
  const app = $("app");
  function stackedDiscAt(px, py) {
    if (px < wellX || px > wellX + wellW) return null;
    for (const d of st.stack) { const y = rowY(d.y); if (py >= y && py < y + cellH) return d; }
    return null;
  }
  app.addEventListener("pointerdown", e => {
    if (st.over || st.shopOpen || e.target.closest("button")) return;
    const r = cv.getBoundingClientRect();
    const d = stackedDiscAt(e.clientX - r.left, e.clientY - r.top);
    if (!d) return;
    if (d.locked || d.dark) { tapHeavy(d); return; }
    drag = { d, tapped: d, x: e.clientX, y: e.clientY, start: d.target, axis: null };
    try { app.setPointerCapture(e.pointerId); } catch (_) {}
  });
  // Locked or dark disc: first tap asks, second tap within 2s smashes it for gold.
  function smashCost() { return has("mercy") ? Math.ceil(SMASH_COST / 2) : SMASH_COST; }
  function tapHeavy(d) {
    if (st.pending || st.checkChain) return;
    const now = performance.now(), cost = smashCost(), what = d.dark ? "Dark disc" : "Locked disc";
    if (d.armed && now - d.armed < 2000) {
      d.armed = 0;
      if (st.gold < cost) { say(`Smashing costs ${cost} gold. You have ${st.gold}.`); return; }
      st.gold -= cost; st.shown = Math.max(0, st.shown - cost);
      st.crumble.push({ d, y: d.y, t: now });
      st.stack = st.stack.filter(x => x !== d);
      st.checkChain = true;
      say(`${what} smashed. -${cost} gold`);
      hud();
    } else {
      d.armed = now;
      if (d.dark) say(st.gold >= cost ? `Dark disc. Tap again to smash it for ${cost} gold.` : `Dark disc. Smashing needs ${cost} gold.`);
      else say(st.gold >= cost ? `Locked disc. Tap again to smash it for ${cost} gold, or use it for ${LOCKED_MULT}x gold.` : `Locked disc. Use it in a word for ${LOCKED_MULT}x gold. Smashing needs ${cost} gold.`);
    }
  }
  app.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis && Math.hypot(dx, dy) > 10) drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (drag.axis === "x" && drag.d) {
      const stepPx = Math.max(28, wellW / 7);
      drag.d.rot = drag.start - dx / stepPx;
      drag.d.target = drag.d.rot;
    }
  });
  app.addEventListener("pointerup", () => {
    if (!drag) return;
    if (drag.axis === "x" && drag.d) drag.d.target = Math.round(drag.d.rot);
    else if (!drag.axis && drag.tapped) drag.tapped.target = Math.round(drag.tapped.target) + 1;
    drag = null;
  });
  app.addEventListener("pointercancel", () => { if (drag && drag.d) drag.d.target = Math.round(drag.d.rot); drag = null; });

  // ---------- coin reward: a pile builds beside the word, then flies to GOLD ----------
  const fx = $("fx"), fctx = fx.getContext("2d");
  let coins = [];       // flying/stacking coins
  let bursts = [];      // pops at the gold counter
  let offerings = [];   // letters drifting into the skull
  let veil = 0;         // moment the skull swallowed: the screen dims briefly
  let laughs = [];      // "HA" rising out of the skull
  // A locked or cursed disc arrives: the skull laughs at you.
  function laugh(text) {
    skullBtn.classList.remove("laugh"); void skullBtn.offsetWidth;
    skullBtn.classList.add("laugh"); setTimeout(() => skullBtn.classList.remove("laugh"), 1400);
    const now = performance.now();
    for (let i = 0; i < 5; i++) laughs.push({ t0: now + i * 230, side: i % 2 ? -1 : 1, size: 16 + (i % 3) * 5 });
    say(text);
  }
  const DROP_MS = 55, HOLD_MS = 350, FLY_MS = 520, STAGGER_MS = 45;
  function mouth() { const s = skullBtn.getBoundingClientRect(); return { x: s.left + s.width / 2, y: s.top + s.height * 0.72, s }; }
  // The skull spits the payment out beside itself as a pile of coins, which then rises to GOLD.
  function addCoins(g, k, t0) {
    const n = Math.max(1, Math.min(16, Math.ceil(g / 5)));
    const m = mouth();
    const dir = k % 2 === 0 ? 1 : -1, step = Math.floor(k / 2);
    const x = dir > 0 ? m.s.right + 20 + step * 30 : m.s.left - 20 - step * 30;
    const by = m.s.bottom - 4;
    const flyStart = t0 + n * DROP_MS + HOLD_MS;
    for (let i = 0; i < n; i++) {
      const share = i === n - 1 ? g - Math.floor(g / n) * (n - 1) : Math.floor(g / n);
      // top coin flies first
      coins.push({ x, y: by - i * 5, sx: m.x, sy: m.y, i, tDrop: t0 + i * DROP_MS, tFly: flyStart + (n - 1 - i) * STAGGER_MS, share, last: i === 0, done: false });
    }
  }
  function drawCoin(x, y, s = 1) {
    const w = 13 * s, h = 4 * s, th = 4 * s;
    fctx.fillStyle = "#fff"; fctx.strokeStyle = "#000"; fctx.lineWidth = 1.6;
    fctx.beginPath(); fctx.ellipse(x, y, w, h, 0, 0, Math.PI); fctx.lineTo(x - w, y - th); fctx.ellipse(x, y - th, w, h, 0, Math.PI, 0, true); fctx.closePath(); fctx.fill(); fctx.stroke();
    fctx.beginPath(); fctx.ellipse(x, y - th, w, h, 0, 0, Math.PI * 2); fctx.fill(); fctx.stroke();
    fctx.beginPath(); fctx.ellipse(x, y - th, w * 0.55, h * 0.55, 0, 0, Math.PI * 2); fctx.stroke();
  }
  function popGold() {
    const el = $("gold");
    if (el.animate) el.animate([{ transform: "scale(1)" }, { transform: "scale(1.45)" }, { transform: "scale(1)" }], { duration: 200, easing: "ease-out" });
  }
  function drawFx(now) {
    const w = window.innerWidth, h = window.innerHeight, pr = window.devicePixelRatio || 1;
    if (fx.width !== Math.round(w * pr) || fx.height !== Math.round(h * pr)) { fx.width = Math.round(w * pr); fx.height = Math.round(h * pr); }
    fctx.setTransform(pr, 0, 0, pr, 0, 0);
    fctx.clearRect(0, 0, w, h);
    // the swallow: a brief dimming of the whole screen
    const vp = (now - veil) / 700;
    if (vp >= 0 && vp < 1) { fctx.fillStyle = `rgba(0,0,0,${0.22 * Math.sin(vp * Math.PI)})`; fctx.fillRect(0, 0, w, h); }
    // offered letters drift down into the mouth, wavering, shrinking as they go
    if (offerings.length) {
      const m = mouth();
      fctx.textAlign = "center"; fctx.textBaseline = "middle"; fctx.fillStyle = "#000";
      for (const o of offerings) {
        const p = (now - o.t0) / o.dur;
        if (p < 0) continue;
        if (p >= 1) { o.done = true; continue; }
        const e = p * p;
        const x = o.x + (m.x - o.x) * e + Math.sin(p * 9 + o.t0) * 10 * (1 - p);
        const y = o.y + (m.y - o.y) * e - Math.sin(p * Math.PI) * 20;
        fctx.globalAlpha = 1 - p * p;
        fctx.font = `bold ${Math.round(26 * (1 - 0.6 * p))}px ui-monospace, Menlo, Consolas, monospace`;
        fctx.fillText(o.ch, x, y);
      }
      fctx.globalAlpha = 1;
      offerings = offerings.filter(o => !o.done);
    }
    if (laughs.length) {
      const m = mouth();
      fctx.textAlign = "center"; fctx.textBaseline = "middle"; fctx.fillStyle = "#000";
      for (const l of laughs) {
        const p = (now - l.t0) / 1100;
        if (p < 0 || p >= 1) continue;
        fctx.globalAlpha = 1 - p;
        fctx.font = `bold ${l.size}px ui-monospace, Menlo, Consolas, monospace`;
        fctx.save();
        fctx.translate(m.x + l.side * (24 + p * 30), m.s.top + 10 - p * 90);
        fctx.rotate(l.side * 0.25 * Math.sin(p * 12));
        fctx.fillText("HA", 0, 0);
        fctx.restore();
      }
      fctx.globalAlpha = 1;
      laughs = laughs.filter(l => now - l.t0 < 1100);
    }
    if (!coins.length && !bursts.length) return;
    const gr = $("gold").getBoundingClientRect();
    const tx = gr.left + gr.width / 2, ty = gr.top + gr.height / 2;
    // draw bottom coins first so the pile overlaps correctly
    const order = coins.slice().sort((a, b) => a.i - b.i);
    for (const c of order) {
      if (c.done || now < c.tDrop) continue;
      if (now < c.tFly) {
        // spat out of the mouth onto the pile
        const p = Math.min(1, (now - c.tDrop) / 220);
        const ease = 1 - (1 - p) * (1 - p);
        drawCoin(c.sx + (c.x - c.sx) * ease, c.sy + (c.y - c.sy) * ease - Math.sin(p * Math.PI) * 30);
      } else {
        const p = Math.min(1, (now - c.tFly) / FLY_MS);
        const e = p * p * (3 - 2 * p);
        const mx = (c.x + tx) / 2 + 40, my = Math.min(c.y, ty) - 80;
        const x = (1 - e) * (1 - e) * c.x + 2 * (1 - e) * e * mx + e * e * tx;
        const y = (1 - e) * (1 - e) * c.y + 2 * (1 - e) * e * my + e * e * ty;
        drawCoin(x, y, 1 - 0.45 * e);
        if (p >= 1) {
          c.done = true;
          st.shown += c.share; hud(); popGold();
          if (c.last) bursts.push({ x: tx, y: ty, t: now });
        }
      }
    }
    coins = coins.filter(c => !c.done);
    // pop: short lines bursting out of the gold counter
    fctx.strokeStyle = "#000"; fctx.lineWidth = 2;
    for (const b of bursts) {
      const p = (now - b.t) / 380;
      fctx.globalAlpha = 1 - p;
      for (let a = 0; a < 10; a++) {
        const ang = a / 10 * Math.PI * 2, r0 = 10 + p * 14, r1 = 16 + p * 26;
        fctx.beginPath(); fctx.moveTo(b.x + Math.cos(ang) * r0, b.y + Math.sin(ang) * r0); fctx.lineTo(b.x + Math.cos(ang) * r1, b.y + Math.sin(ang) * r1); fctx.stroke();
      }
      fctx.globalAlpha = 1;
    }
    bursts = bursts.filter(b => now - b.t < 380);
  }

  $("skull").addEventListener("click", submit);
  $("restart").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  $("skip").addEventListener("click", () => startRound(st.round + 1));
  window.addEventListener("resize", resize);

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt, now); draw(now); drawFx(now);
    requestAnimationFrame(loop);
  }
  resize(); newGame(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
